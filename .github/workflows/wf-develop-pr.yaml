name: wf-develop-pr
on:
  pull_request:
    branches:
      - develop
jobs:
  develop-pr-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Lint html and css
        run: |
          npx htmlhint "**/*.html"
          npx stylelint "**/*.css"
      - name: Built Website
        run: npx parcel built "./src/index.html" --dist-dir "./dev" --public-url "./"